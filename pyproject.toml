[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxmoe"
version = "0.1.0"
description = "Stage 3 TaxMoE dataset pipeline foundation"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0.2,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
