[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxmoe"
version = "0.1.0"
description = "TaxMoE tax dataset, Qwen input, and n-gram routing pipeline"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0",
  "typer>=0.12",
  "transformers>=4.51",
  "tokenizers>=0.21",
  "torch>=2.5",
  "pyarrow>=17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
taxmoe = "taxmoe.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
