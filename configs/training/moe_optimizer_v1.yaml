# Stage 6 starting recipe. The architecture is fixed, but production values must
# be confirmed by the RTX 3060 Ti MoE profile before a frozen model release.
optimization:
  precision: bf16
  optimizer: adamw
  learning_rate: 8.0e-6
  weight_decay: 0.10
  betas: [0.9, 0.95]
  eps: 1.0e-8
  gradient_clip_norm: 1.0
  scheduler: cosine
  warmup_ratio: 0.05
  gradient_accumulation_steps: 8
